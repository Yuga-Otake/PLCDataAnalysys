[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[theme]
# OMRON IA Catalog Design System（製品 UI 規定）に準拠
base = "light"
primaryColor = "#0068b8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eaeef0"
textColor = "#1d1d1b"
linkColor = "#0068b8"
borderColor = "#dadbde"
showWidgetBorder = true
baseRadius = "6px"
baseFontSize = 14
font = "Roboto, \"Noto Sans JP\", \"Hiragino Kaku Gothic ProN\", \"Yu Gothic\", sans-serif"
headingFont = "Roboto, \"Noto Sans JP\", \"Hiragino Kaku Gothic ProN\", \"Yu Gothic\", sans-serif"
codeFont = "\"Roboto Mono\", ui-monospace, monospace"
chartCategoricalColors = ["#0068b8", "#f0a44c", "#22a745", "#7d9cb5", "#29abe2", "#58585a", "#e5352b", "#a8e6c0"]

[theme.sidebar]
backgroundColor = "#f5f7f8"
secondaryBackgroundColor = "#ffffff"
